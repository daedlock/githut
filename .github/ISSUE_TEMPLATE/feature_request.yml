name: Feature request
description: Propose a new feature or improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should GitHut solve?
      placeholder: Describe the workflow, pain point, or missing capability.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
      placeholder: Describe the behavior, UI, shortcuts, API behavior, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: What other approaches did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Repository browsing
        - Issues
        - Pull requests
        - Code review
        - Search / navigation
        - Authentication / permissions
        - Performance
        - Design / accessibility
        - Developer experience
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links to GitHub behavior, examples from other tools, or implementation notes.
