name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://githut.app
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc --noEmit

      - name: Build
        run: bun run build

      # Production hands sign-in tokens back only to our own PR preview hosts
      # (see src/worker/previewAuth.ts), so it needs this account's subdomain.
      - name: Resolve preview host suffix
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          if [ -z "$sub" ] || [ "$sub" = "null" ]; then
            echo "::warning::No workers.dev subdomain; PR preview sign-in stays disabled."
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=githut.$sub.workers.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var PREVIEW_HOST_SUFFIX:${{ steps.preview.outputs.suffix }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: bun
