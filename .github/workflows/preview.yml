name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy PR preview
    # Fork PRs don't get secrets; previews are for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # A version upload never touches production; the alias gives it a stable
      # URL per PR. APP_URL tells the preview its own address, and
      # PRODUCTION_URL routes its sign-in through githut.app.
      - name: Upload preview version
        id: upload
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          if [ -z "$sub" ] || [ "$sub" = "null" ]; then
            echo "::error::No workers.dev subdomain on this Cloudflare account; enable it to get preview URLs."
            exit 1
          fi
          url="https://pr-$PR-githut.$sub.workers.dev"
          bunx wrangler versions upload \
            --preview-alias "pr-$PR" \
            --var "APP_URL:$url" \
            --var "PRODUCTION_URL:https://githut.app" \
            --message "PR-$PR@${SHA:0:7}" | tee upload.log
          if ! grep -qF "$url" upload.log; then
            echo "::error::Wrangler reported a different preview URL than $url"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          marker="<!-- githut-preview -->"
          body="$marker
          **Preview:** $URL

          Built from \`${SHA:0:7}\`. Sign-in goes through githut.app and returns you here. It uses your real GitHub account, so actions taken in the preview are real."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
