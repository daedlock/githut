<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHut</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:title" content="GitHut" />
    <meta property="og:description" content="Your GitHub, redesigned." />
    <meta property="og:image" content="https://githut.app/og.png" />
    <meta property="og:url" content="https://githut.app" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://githut.app/og.png" />

    <!-- Preload critical fonts so they're ready before first paint -->
    <link rel="preload" href="/fonts/BerkeleyMono-SemiCondensed.ttf" as="font" type="font/ttf" crossorigin />

    <!--
      Pre-hydration theme + background. Reads persisted zustand state and sets
      data-theme / .dark / background-color on <html> BEFORE React paints.
      Background is set inline so the browser never shows white.
    -->
    <script>
      (function () {
        var BG = {
          "main-dark":"#1c1d24","main-light":"#f8f8f8",
          "ember":"#1c1b19","ember-soft":"#242320","ember-light":"#e6dac4",
          "dune":"#171b1e","haze":"#2a292e",
          "lagoon":"#101a18","lagoon-light":"#d8eae6",
          "matrix":"#0c120f","moss":"#1e2421","sagecream":"#1a1918"
        };
        try {
          var raw = localStorage.getItem("githut.theme");
          var palette = "main";
          var preference = "system";
          if (raw) {
            var parsed = JSON.parse(raw);
            var s = (parsed && parsed.state) || {};
            if (s.palette) palette = s.palette;
            if (s.preference) preference = s.preference;
          }
          var resolved = preference;
          if (resolved === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var dataTheme = null;
          if (palette === "main") dataTheme = resolved === "dark" ? "main-dark" : "main-light";
          else if (palette === "ember") dataTheme = resolved === "dark" ? "ember" : "ember-light";
          else if (palette === "ember-soft") dataTheme = resolved === "dark" ? "ember-soft" : "ember-light";
          else if (palette === "lagoon") dataTheme = resolved === "dark" ? "lagoon" : "lagoon-light";
          else if (palette === "lagoon-light") dataTheme = resolved === "light" ? "lagoon-light" : "lagoon";
          else if (palette === "dune") dataTheme = "dune";
          else if (palette === "haze") dataTheme = "haze";
          else if (palette === "matrix") dataTheme = "matrix";
          else if (palette === "moss") dataTheme = "moss";
          else if (palette === "sagecream") dataTheme = "sagecream";

          var root = document.documentElement;
          if (dataTheme) root.setAttribute("data-theme", dataTheme);
          if (resolved === "dark") root.classList.add("dark");

          var bg = dataTheme && BG[dataTheme]
            ? BG[dataTheme]
            : resolved === "dark" ? "#1c1d24" : "#f8f8f8";
          root.style.backgroundColor = bg;
          root.style.colorScheme = resolved;
        } catch (_) {
          /* ignore — theme store will re-apply on mount */
        }
      })();
    </script>

    <!-- Strip OAuth token fragments before analytics or app code runs. -->
    <script>
      (function () {
        try {
          if (!window.location.hash.startsWith("#t=")) return;
          var token = window.location.hash.slice(3);
          if (!token) return;
          sessionStorage.setItem("githut.oauth_token", token);
          history.replaceState(null, "", window.location.pathname + window.location.search);
        } catch (_) {
          /* ignore — app bootstrap still handles the hash fallback */
        }
      })();
    </script>

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="4b5b9dea-69f9-45de-bec6-5dddac52c360"
      data-domains="githut.app,www.githut.app"
    ></script>

    <!-- Inline critical styles for the app shell skeleton -->
    <style>
      html, body, #root { height: 100%; margin: 0 }
      body { font-family: "Inter Variable","Inter",ui-sans-serif,system-ui,-apple-system,sans-serif }
      #shell {
        display: flex; flex-direction: column; height: 100%;
        opacity: 1; transition: opacity 80ms ease-out;
      }
      #shell.hide { opacity: 0 }
      #shell-bar {
        height: 36px; flex-shrink: 0;
        border-bottom: 1px solid var(--color-border, #e7e5e4);
      }
      .dark #shell-bar { border-color: var(--color-border, #292524) }
      #shell-body { flex: 1 }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static app shell — replaced by React on mount -->
      <div id="shell">
        <div id="shell-bar"></div>
        <div id="shell-body"></div>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
