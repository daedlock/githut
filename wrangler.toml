name = "githut"
main = "src/worker/index.ts"
compatibility_date = "2025-04-20"
compatibility_flags = ["nodejs_compat"]

# Workers Builds serves each branch/PR at <alias>-githut.hossam-saraya.workers.dev.
preview_urls = true

routes = [
  { pattern = "githut.app", custom_domain = true },
  { pattern = "www.githut.app", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_URL = "https://githut.app"
# Previews sign in through APP_URL; only these hosts get the token back.
PREVIEW_HOST_SUFFIX = "githut.hossam-saraya.workers.dev"


[[r2_buckets]]
bucket_name = "githut-uploads"
binding = "UPLOADS"
